<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The appliance name, matching homelab-standards docs/inventory.md and the
         shell header. It read "Flip Board" while the header said "Display Setup"
         and the repo said split-flap — three names for one box. -->
    <title>Split-Flap Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cairo 700 was here for the Arabic word-clock matrix and came out with
         it (#80). Roboto Condensed remains, and remains a webfont on a display
         that must keep working with no internet — see the warning in
         homelab-standards/docs/style-guide.md. Self-hosting it is still open. -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <!-- Tinted by the route-setup script below: Safari colours its tab/toolbar
         chrome from this, and falls back to the body background when it is
         absent. There was none, so the global kiosk background made the tab bar
         black on /setup too — a light admin page under black browser chrome. -->
    <meta name="theme-color" content="#1a1a1a" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
      }

      /* Kiosk styling is scoped to the display route rather than applied to
         every page and undone on the ones that don't want it. It used to be a
         bare `body { … }` rule, which cost three separate workarounds: a
         useEffect in Setup.jsx relaxing four declarations (#54), a cursor
         override in setup.css (#52), and — the one nobody undid, and so the one
         still visible — the background behind Safari's tab bar (#79).

         The display centres its own content via .app (100vw/100vh, flex) in
         flip.css, so only these three are genuinely document-level. */
      html.kiosk,
      html.kiosk body {
        background-color: #1a1a1a;
      }
      html.kiosk body {
        overflow: hidden;        /* kiosk: never scroll (FR-35) */
        cursor: none;            /* kiosk: hide pointer (FR-37) */
      }

      /* The admin surface is light in both board themes, per
         homelab-standards/docs/style-guide.md. --hl-canvas, inlined because
         tokens.css is imported by the bundle and this must be right on the
         very first paint. */
      html.admin,
      html.admin body {
        background-color: #f6f8fa;
      }
      /* The admin page is as tall as its content, unlike the board, which is
         exactly one viewport. Without this the fixed 100% height above boxes it
         to the viewport and the overflow escapes its own container. */
      html.admin,
      html.admin body,
      html.admin #root {
        height: auto;
        min-height: 100%;
      }
    </style>
    <script>
      // Runs synchronously during parse, BEFORE the first paint — which is the
      // whole point. A module script (main.jsx) is deferred, so the browser
      // would paint one frame of the wrong background first: a white flash on a
      // wall-mounted board, or a black one on /setup.
      (function () {
        var admin = window.location.pathname.replace(/\/+$/, '') === '/setup';
        document.documentElement.classList.add(admin ? 'admin' : 'kiosk');
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', admin ? '#f6f8fa' : '#1a1a1a');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
