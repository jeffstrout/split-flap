name: PR - Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR base branch
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "base_ref=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
          else
            BASE_REF=$(gh pr view ${{ github.event.issue.number }} --json baseRefName -q '.baseRefName')
            echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          fi

      # An advisory reviewer must not gate a PR whose tests pass.
      #
      # This step has failed on every PR since 2026-07-19 (#74). The call dies
      # 0.35s after init -- one turn, $0 spent, is_error:true -- so it is
      # rejected before any review happens. The ANTHROPIC_API_KEY secret exists,
      # which points at the key itself: expired, revoked, out of credit, or
      # without access to the model the action defaults to.
      #
      # The result was a red X on every PR while `Tests` was green, which trains
      # you to merge past a failing check -- worse than having no reviewer,
      # because the day a real check fails it looks exactly the same.
      #
      # So the reviewer is advisory: it still runs, still posts, and its failure
      # is still visible in the job list, but it no longer marks the PR failed.
      # `Tests` remains the gate. Remove this line once #74 is fixed and a
      # broken reviewer should shout again.
      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this Pull Request using the standards in .claude/agents/code-reviewer.md

            1. Read .claude/agents/code-reviewer.md for the full checklist
            2. Run `git diff origin/${{ steps.pr-info.outputs.base_ref }}...HEAD` to see changes
            3. Apply the review checklist to modified files
            4. Post your feedback as a SINGLE consolidated PR comment, organized by
               severity (Critical, Warning, Suggestion). Skip `npm run build` unless
               a change makes you genuinely doubt the build still passes.
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm run build:*)"
